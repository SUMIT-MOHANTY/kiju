<tr id="todo-row-{{ todo.id }}" class="bg-blue-50">
    <td class="px-6 py-4">
        <input type="checkbox" {% if todo.completed %}checked{% endif %} disabled class="w-5 h-5 text-gray-400 border-gray-300 rounded cursor-not-allowed">
    </td>
    <td class="px-6 py-4" colspan="2">
        <form hx-patch="{% url 'todos:update' todo.id %}"
              hx-target="#todo-row-{{ todo.id }}"
              hx-swap="outerHTML"
              hx-indicator="#edit-indicator-{{ todo.id }}"
              class="flex flex-col gap-3">
            {% csrf_token %}
            <input type="text"
                   name="title"
                   value="{{ todo.title }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   required>
            <textarea name="description"
                      placeholder="Description (optional)"
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                      rows="2">{{ todo.description }}</textarea>
        </form>
    </td>
    <td class="px-6 py-4">
        <span class="text-sm text-gray-500">
            {% if todo.completed_at %}{{ todo.completed_at|date:"M d, Y H:i" }}{% else %}-{% endif %}
        </span>
    </td>
    <td class="px-6 py-4 text-right">
        <button type="submit"
                form="todo-row-{{ todo.id }} form"
                class="text-green-600 hover:text-green-900 font-medium mr-3 transition-colors flex items-center gap-1">
            <span>Save</span>
            <span id="edit-indicator-{{ todo.id }}" class="htmx-indicator">
                <svg class="animate-spin h-3 w-3 text-green-600 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </span>
        </button>
        <button hx-get="{% url 'todos:row' todo.id %}"
                hx-target="#todo-row-{{ todo.id }}"
                hx-swap="outerHTML"
                class="text-gray-600 hover:text-gray-900 font-medium transition-colors">
            Cancel
        </button>
    </td>
</tr>
