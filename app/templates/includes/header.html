<header class="bg-white shadow-sm border-b border-slate-200">
    <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/" class="text-xl font-bold text-indigo-600">TodoApp</a>
        <div class="flex items-center space-x-4">
            {% if user.is_authenticated %}
                <a href="{% url 'todos:dashboard' %}" class="text-slate-600 hover:text-indigo-600">Dashboard</a>
                <a href="{% url 'accounts:logout' %}" class="text-slate-600 hover:text-indigo-600">Logout</a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="text-slate-600 hover:text-indigo-600">Login</a>
                <a href="{% url 'accounts:register' %}" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Register</a>
            {% endif %}
        </div>
    </nav>
</header>
