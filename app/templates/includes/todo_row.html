<tr id="todo-row-{{ todo.id }}" class="hover:bg-gray-50 transition-colors">
    <td class="px-6 py-4">
        <input type="checkbox"
               {% if todo.completed %}checked{% endif %}
               hx-patch="{% url 'todos:toggle' todo.id %}"
               hx-target="#todo-row-{{ todo.id }}"
               hx-swap="outerHTML"
               hx-indicator="#toggle-indicator-{{ todo.id }}"
               class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
        <span id="toggle-indicator-{{ todo.id }}" class="htmx-indicator ml-2">
            <svg class="animate-spin h-4 w-4 text-blue-600 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </span>
    </td>
    <td class="px-6 py-4">
        <div class="text-sm font-medium text-gray-900 {% if todo.completed %}line-through text-gray-500{% endif %}">
            {{ todo.title }}
        </div>
        {% if todo.description %}
        <div class="text-sm text-gray-500 {% if todo.completed %}line-through{% endif %}">
            {{ todo.description }}
        </div>
        {% endif %}
    </td>
    <td class="px-6 py-4">
        <span id="status-badge-{{ todo.id }}"
              class="inline-flex px-2 py-1 text-xs font-semibold rounded-full {% if todo.completed %}bg-green-100 text-green-800{% else %}bg-gray-100 text-gray-800{% endif %}">
            {% if todo.completed %}Complete{% else %}Pending{% endif %}
        </span>
    </td>
    <td class="px-6 py-4">
        <span id="completed-at-{{ todo.id }}" class="text-sm text-gray-500">
            {% if todo.completed_at %}{{ todo.completed_at|date:"M d, Y H:i" }}{% else %}-{% endif %}
        </span>
    </td>
    <td class="px-6 py-4 text-right">
        <button hx-get="{% url 'todos:edit' todo.id %}"
                hx-target="#todo-row-{{ todo.id }}"
                hx-swap="outerHTML"
                class="text-blue-600 hover:text-blue-900 font-medium mr-3 transition-colors">
            Edit
        </button>
        <button hx-delete="{% url 'todos:delete' todo.id %}"
                hx-target="#todo-row-{{ todo.id }}"
                hx-swap="outerHTML swap:0.5s"
                hx-confirm="Are you sure you want to delete this todo?"
                class="text-red-600 hover:text-red-900 font-medium transition-colors">
            Delete
        </button>
    </td>
</tr>
