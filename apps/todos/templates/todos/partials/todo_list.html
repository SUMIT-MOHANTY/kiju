<div id="todo-list-container">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="todo-list">
            {% for todo in todos %}
                {% include "todos/partials/todo_row.html" with todo=todo only %}
            {% empty %}
                <tr id="empty-state">
                    <td colspan="3" class="text-center text-muted py-4">
                        No todos yet. Add your first todo above!
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
