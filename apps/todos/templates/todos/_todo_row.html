<tr id="todo-{{ todo.id }}" class="{% if todo.is_completed %}completed{% endif %}">
    <td class="todo-checkbox">
        <input type="checkbox"
               {% if todo.is_completed %}checked{% endif %}
               hx-post="{% url 'todos:toggle' todo.id %}"
               hx-target="#todo-{{ todo.id }}"
               hx-swap="outerHTML">
    </td>
    <td class="todo-title">{{ todo.title }}</td>
    <td class="todo-description">{{ todo.description }}</td>
    <td class="todo-actions">
        <button type="button"
                class="btn btn-sm btn-primary"
                hx-get="{% url 'todos:edit_form' todo.id %}"
                hx-target="#todo-{{ todo.id }}"
                hx-swap="outerHTML">
            Edit
        </button>
        <button type="button"
                class="btn btn-sm btn-danger"
                hx-delete="{% url 'todos:delete' todo.id %}"
                hx-target="#todo-{{ todo.id }}"
                hx-swap="outerHTML swap:0.3s"
                hx-confirm="Are you sure you want to delete this todo?">
            Delete
        </button>
    </td>
</tr>
