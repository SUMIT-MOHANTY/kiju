<form hx-post="{% url 'todos:create' %}" hx-target="#todo-list" hx-swap="beforeend" hx-on::after-request="if(event.detail.successful) this.reset()" class="space-y-4">
  {% csrf_token %}
  <div>
    <label for="id_title" class="block text-sm font-medium text-gray-700">Title</label>
    <input type="text" name="title" id="id_title" required maxlength="200" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" placeholder="Enter todo title">
  </div>
  <div>
    <label for="id_description" class="block text-sm font-medium text-gray-700">Description</label>
    <textarea name="description" id="id_description" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" placeholder="Enter description (optional)"></textarea>
  </div>
  <div class="flex justify-end">
    <button type="submit" class="inline-flex justify-center rounded-md border border-transparent bg-indigo-600 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
      Add Todo
    </button>
  </div>
</form>
